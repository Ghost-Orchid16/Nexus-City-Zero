<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3f3570" />
    <meta name="description" content="NEXUS: CITY ZERO — save the city before it collapses. A 2D crisis-management game." />
    <title>NEXUS: CITY ZERO</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(135deg, #3f3570 0%, #2b2350 45%, #146360 100%);
        font-family: 'Nunito', system-ui, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #game canvas {
        display: block;
        box-shadow: 0 0 60px rgba(28, 19, 48, 0.55);
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #fff5e0;
        letter-spacing: 0.3em;
        font-size: clamp(14px, 2vw, 28px);
        font-weight: 800;
        transition: opacity 0.4s ease;
        pointer-events: none;
      }
      #boot-splash span {
        display: inline-block;
        padding: 0.8em 1.4em;
        border: 3px solid #ffe159;
        border-radius: 12px;
        background: rgba(43, 35, 80, 0.6);
      }
      #boot-splash.hidden {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot-splash"><span>NEXUS: CITY ZERO — LOADING</span></div>
    <noscript>NEXUS: CITY ZERO needs JavaScript enabled.</noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
